<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Web</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 10px;
      text-align: center;
    }

    div {
      width: 100%;
      margin: 5px;
      box-sizing: border-box;
    }

    img {
      width: 100%;
      height: auto;
    }

    @media screen and (min-width: 772px) {
      div {
        width: 45vw;
        display: inline-block;
      }

      img {
        max-height: 30vh;
        width: auto;
      }
    }

    @media screen and (min-width: 998px) {
      div {
        width: 30vw;
      }
    }
  </style>
</head>
<body>

  <div>
    <img src="https://via.placeholder.com/400" alt="Hinh 1">
  </div>
  <div>
    <img src="https://via.placeholder.com/400" alt="Hinh 2">
  </div>
  <div>
    <img src="https://via.placeholder.com/400" alt="Hinh 3">
  </div>

</body>
</html>
