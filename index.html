<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh có thể truy cập</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Thư viện ảnh của tôi</h1>
    
    <!-- Đây là phần hiển thị ảnh lớn khi di chuột hoặc dùng phím tab -->
    <div id="image">
        Di chuột qua hoặc dùng phím Tab chọn một hình ảnh bên dưới để hiển thị tại đây.
    </div>

    <!-- 6 hình ảnh của bạn -->
    <div id="gallery">
    <img class="preview" alt="Mô tả ảnh 1: Dãy núi" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=150&h=150&fit=crop" 
         onmouseover="upDate(this)" onfocus="upDate(this)" 
         onmouseleave="unDo()" onblur="unDo()">

    <img class="preview" alt="Mô tả ảnh 2: Bãi biển" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=150&h=150&fit=crop" 
         onmouseover="upDate(this)" onfocus="upDate(this)" 
         onmouseleave="unDo()" onblur="unDo()">

    <img class="preview" alt="Mô tả ảnh 3: Rừng cây" src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=150&h=150&fit=crop" 
         onmouseover="upDate(this)" onfocus="upDate(this)" 
         onmouseleave="unDo()" onblur="unDo()">

    <img class="preview" alt="Mô tả ảnh 4: Thành phố" src="https://images.unsplash.com/photo-1449844908441-8829872d2607?w=150&h=150&fit=crop" 
         onmouseover="upDate(this)" onfocus="upDate(this)" 
         onmouseleave="unDo()" onblur="unDo()">

    <img class="preview" alt="Mô tả ảnh 5: Động vật" src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=150&h=150&fit=crop" 
         onmouseover="upDate(this)" onfocus="upDate(this)" 
         onmouseleave="unDo()" onblur="unDo()">

    <img class="preview" alt="Mô tả ảnh 6: Không gian" src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=150&h=150&fit=crop" 
         onmouseover="upDate(this)" onfocus="upDate(this)" 
         onmouseleave="unDo()" onblur="unDo()">
</div>

    <script src="js/gallery.js"></script>
</body>
</html>
